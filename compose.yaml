name: sample-handoff-ledger

services:
  db:
    image: postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handoff}
      POSTGRES_USER: ${POSTGRES_USER:-handoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - handoff-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://handoff:change-me@db:5432/handoff}
      HANDOFF_SIGNING_KEY: ${HANDOFF_SIGNING_KEY:?set HANDOFF_SIGNING_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      HANDOFF_DEFAULT_TTL_MINUTES: ${HANDOFF_DEFAULT_TTL_MINUTES:-10}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "4173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  handoff-postgres:
